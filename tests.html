<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BroStom — browser test suite</title>
<link rel="stylesheet" href="./src/ui/style.css" />
<style>
  html, body { overflow: auto; height: auto; }
  body { padding: 24px 28px 60px; }

  h1 {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.24em;
    color: var(--accent);
    margin: 0 0 4px;
  }

  .lede { font-size: 11.5px; color: var(--dim); margin: 0 0 18px; line-height: 1.7; }

  #summary {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 9px 14px;
    border-radius: 8px;
    display: inline-block;
    border: 1px solid var(--line);
  }

  #summary.good { color: var(--ok); border-color: rgba(142, 255, 201, 0.45); background: rgba(142, 255, 201, 0.08); }
  #summary.bad  { color: var(--danger); border-color: rgba(255, 106, 92, 0.5); background: rgba(255, 106, 92, 0.1); }

  #results { list-style: none; margin: 18px 0 0; padding: 0; max-width: 900px; }

  #results li {
    font-size: 11.5px;
    padding: 5px 10px 5px 24px;
    border-bottom: 1px solid rgba(120, 180, 220, 0.08);
    position: relative;
    color: var(--fg);
  }

  #results li::before {
    position: absolute;
    left: 6px;
    font-family: var(--mono);
  }

  #results li.ok::before { content: "✓"; color: var(--ok); }
  #results li.fail::before { content: "✕"; color: var(--danger); }
  #results li.fail { color: #ffb0a8; }
  #results li b { color: var(--dim); font-weight: 600; margin-right: 8px; }
  #results li em { display: block; font-style: normal; color: var(--danger); margin-top: 3px; font-family: var(--mono); font-size: 10.5px; }

  /* The app under test renders off to one side, small but live. */
  #harness {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 320px;
    height: 200px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    opacity: 0.55;
    pointer-events: none;
  }

  #harness canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #harness #overlay { position: absolute; inset: 0; transform: scale(0.42); transform-origin: top left; width: 238%; height: 238%; }
</style>
</head>
<body>
  <h1>BroStom TEST SUITE</h1>
  <p class="lede">
    WebGL・2Dキャンバス・DOM を必要とする部分のテスト。<br>
    ロジック側（コア／ZMF／アニメーション）は <code>npm test</code> の Vitest スイートが担当します。
  </p>
  <div id="summary">running…</div>
  <ul id="results"></ul>
  <div id="harness"></div>

  <script>window.__BROSTOM_NO_AUTOBOOT = true;</script>
  <script type="module" src="/tests/browser/suite.js"></script>
</body>
</html>
